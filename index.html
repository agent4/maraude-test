<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relevé maraude</title>
<meta name="theme-color" content="#101821">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#101821; --surface:#18222E; --surface-2:#22303F;
  --line:#2E3E50; --text:#EAF0F6; --muted:#9AAABB;
  --accent:#FFB020; --accent-ink:#241802; --ok:#48C78E; --bad:#F26A5A;
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1{font-size:20px;font-weight:600;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
input[type=text]{
  width:100%;padding:14px;font-size:17px;color:var(--text);
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
}
input[type=text]:focus,button:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.stamp{font-variant-numeric:tabular-nums;font-size:18px}
.hint{color:var(--muted);font-size:13px}
.link{background:none;border:none;color:var(--accent);font-size:14px;padding:6px 0;cursor:pointer}

/* compteur */
.count{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.count .num{font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;min-width:86px;text-align:center;line-height:1}
.step{width:56px;height:56px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);font-size:26px;line-height:1;cursor:pointer}
.step:active{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;height:40px;background:none;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--surface-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;
  background:var(--accent);border:3px solid var(--bg);margin-top:-13px}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--surface-2)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border:3px solid var(--bg);border-radius:50%;background:var(--accent)}

/* répartition */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px}
.tag .name{padding:0 8px;font-size:15px}
.tag .v{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.tag button{width:38px;height:38px;border-radius:50%;border:none;background:transparent;color:var(--text);font-size:20px;cursor:pointer}
.tag button:active{background:var(--accent);color:var(--accent-ink)}
.tag.on{border-color:var(--accent)}
.left{font-size:13px;color:var(--muted);margin-top:10px}
.left b{color:var(--text)}

/* carte */
#map{height:253px;border-radius:10px;border:1px solid var(--line);margin-top:4px;
  position:relative;isolation:isolate;z-index:0}
.coords{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:16px}
.coords b{color:var(--text);font-weight:600}
.leaflet-container{background:var(--surface-2)}
.gps{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}

/* envoi */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:100;background:linear-gradient(180deg,rgba(16,24,33,0),var(--bg) 28%);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.bar .inner{max-width:560px;margin:0 auto}
.send{width:100%;padding:18px;font-size:18px;font-weight:600;border:none;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer}
.send[disabled]{opacity:.5}
.toast{position:fixed;left:16px;right:16px;bottom:96px;margin:0 auto;max-width:528px;
  background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--ok);
  border-radius:10px;padding:12px 14px;font-size:15px;display:none}
.toast.bad{border-left-color:var(--bad)}
/* session */
.session{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;
  padding:10px 12px;margin:10px 0 18px;font-size:14px;color:var(--muted);background:var(--surface)}
.session .n{color:var(--text);font-weight:600}
.session .sp{margin-left:auto;display:flex;gap:14px}
.past{opacity:.75}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F7F8FA;--surface:#FFFFFF;--surface-2:#EFF2F6;--line:#D9E0E8;
    --text:#131A22;--muted:#5C6A79;--accent:#E07B00;--accent-ink:#FFFFFF;
  }
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Relevé maraude</h1>
  <p class="sub">Un relevé par point d'observation. Tout est pré-rempli, vérifiez et envoyez.</p>
  <div class="session">
    <span id="sessInfo">Nouvelle maraude</span>
    <span class="sp">
      <button class="link" type="button" id="undo" hidden>Annuler le dernier</button>
      <button class="link" type="button" id="endSess" hidden>Terminer</button>
    </span>
  </div>

  <section>
    <label class="lbl" for="prenom">Votre prénom</label>
    <input type="text" id="prenom" autocomplete="given-name" enterkeyhint="done" placeholder="Camille">
  </section>

  <section>
    <div class="row">
      <div>
        <span class="lbl" style="margin:0">Date et heure</span>
        <div class="stamp" id="stamp">—</div>
      </div>
      <button class="link" type="button" id="editTime">Corriger</button>
    </div>
    <div id="timeEdit" hidden style="margin-top:10px;display:flex;gap:8px">
      <input type="date" id="dateIn" style="flex:1;padding:12px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:16px">
      <input type="time" id="timeIn" style="width:120px;padding:12px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:16px">
    </div>
  </section>

  <section>
    <span class="lbl">Position — déplacez la pastille si besoin</span>
    <div id="map"></div>
  <div class="coords"><span>Lat <b id="latTxt">—</b></span><span>Lon <b id="lonTxt">—</b></span></div>
    <div class="gps">
      <span class="dot" id="dot"></span>
      <span id="gpsTxt">Recherche du signal GPS…</span>
      <button class="link" type="button" id="recenter" style="margin-left:auto">Revenir sur ma position</button>
    </div>
  </section>

  <section>
    <span class="lbl">Livreurs présents</span>
    <div class="count">
      <button class="step" type="button" id="minus" aria-label="Un livreur de moins">−</button>
      <div class="num" id="total">0</div>
      <button class="step" type="button" id="plus" aria-label="Un livreur de plus">+</button>
    </div>
    <input type="range" id="slider" min="0" max="30" step="1" value="0" aria-label="Nombre de livreurs">
  </section>

  <section id="detail">
    <div class="row">
      <span class="lbl" style="margin:0">Détail (facultatif)</span>
      <button class="link" type="button" id="skip">Je n'ai pas pu détailler</button>
    </div>
    <div class="hint" style="margin-top:8px">Véhicule</div>
    <div class="tags" id="modes"></div>
    <div class="hint" style="margin-top:12px">Plateforme</div>
    <div class="tags" id="brands"></div>
    <div class="left" id="left"></div>
  </section>
</div>

<div class="bar"><div class="inner">
  <button class="send" id="send">Envoyer le relevé</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ------------------------------------------------------------------
   1. Collez ici l'URL de votre Web App Google Apps Script (voir .gs)
------------------------------------------------------------------ */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwxX97wIqzdIW-CeQo7q51MC_zHsu5uiHEEms937WTosEqCUZscOsYoN8Faz6fKTuFk/exec";   // ex: "https://script.google.com/macros/s/XXXX/exec"

const MODES  = ["Vélo","Scooter / moto","Autre"];
const BRANDS = ["Deliveroo","Uber Eats","Autre / inconnu"];

const $ = s => document.querySelector(s);
const state = { total:0, modes:{}, brands:{}, lat:null, lon:null, acc:null, moved:false, detailed:true };
MODES.forEach(m=>state.modes[m]=0); BRANDS.forEach(b=>state.brands[b]=0);

/* --- maraude en cours ------------------------------------------------
   Une "maraude" = une sortie. Elle se ferme à la main ou toute seule
   après 6 h sans relevé, pour ne pas coller la sortie de la veille.   */
const SK = "maraude.session", GAP = 6*3600*1000;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
let sess = null;

function loadSess(){
  try{ const s = JSON.parse(localStorage.getItem(SK)||"null");
       if(s && Date.now() - s.maj < GAP) sess = s; else localStorage.removeItem(SK);
  }catch(e){}
}
function saveSess(){ try{ sess ? localStorage.setItem(SK, JSON.stringify(sess)) : localStorage.removeItem(SK); }catch(e){} }
function openSess(){ sess = {id:uid(), debut:new Date().toISOString(), maj:Date.now(), points:[]}; saveSess(); }

function paintSess(){
  const n = sess ? sess.points.length : 0;
  const livreurs = sess ? sess.points.reduce((a,p)=>a+p.total,0) : 0;
  $("#sessInfo").innerHTML = n === 0
    ? `Maraude en cours — <span class="n">1<sup>er</sup> point</span>`
    : `<span class="n">${n} point${n>1?"s":""}</span> relevé${n>1?"s":""} · ${livreurs} livreur${livreurs>1?"s":""} au total`;
  $("#undo").hidden = n === 0;
  $("#endSess").hidden = n === 0;
}
loadSess(); paintSess();

/* --- prénom mémorisé --- */
try{ $("#prenom").value = localStorage.getItem("maraude.prenom") || ""; }catch(e){}
$("#prenom").addEventListener("change", e=>{ try{localStorage.setItem("maraude.prenom", e.target.value.trim());}catch(err){} });

/* --- date / heure --- */
const pad = n => String(n).padStart(2,"0");
function now(){ const d=new Date();
  return {date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, time:`${pad(d.getHours())}:${pad(d.getMinutes())}`}; }
function paintStamp(){
  const d = $("#dateIn").value, t = $("#timeIn").value;
  const [y,m,j] = d.split("-");
  $("#stamp").textContent = `${j}/${m}/${y} à ${t}`;
}
const n0 = now(); $("#dateIn").value = n0.date; $("#timeIn").value = n0.time; paintStamp();
$("#editTime").onclick = () => {
  const box = $("#timeEdit"); box.hidden = !box.hidden;
  $("#editTime").textContent = box.hidden ? "Corriger" : "Terminé";
};
$("#dateIn").onchange = paintStamp; $("#timeIn").onchange = paintStamp;

/* --- carte + géolocalisation --- */
const map = L.map("map",{zoomControl:false, attributionControl:true}).setView([48.8566,2.3522],13);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{
  maxZoom:19,
  attribution:"Tiles © Esri — Source: Esri, DeLorme, NAVTEQ"
}).addTo(map);
const marker = L.marker([48.8566,2.3522],{draggable:true}).addTo(map);
let halo = null, firstFix = true;

function setPos(lat,lon,{fromUser=false, acc=null}={}){
  state.lat = lat; state.lon = lon;
  if(fromUser){ state.moved = true; } else { state.acc = acc; }
  marker.setLatLng([lat,lon]);
  $("#latTxt").textContent = lat.toFixed(6);
  $("#lonTxt").textContent = lon.toFixed(6);
  if(!fromUser){
    if(halo) map.removeLayer(halo);
    if(acc) halo = L.circle([lat,lon],{radius:acc,color:"#FFB020",weight:1,fillOpacity:.08}).addTo(map);
  }
  paintGps();
}
function paintGps(){
  const dot = $("#dot"), txt = $("#gpsTxt");
  if(state.lat === null){ dot.className="dot bad"; txt.textContent="Position indisponible — placez la pastille à la main"; return; }
  dot.className = "dot ok";
  txt.textContent = state.moved
    ? "Position corrigée à la main"
    : `Position GPS${state.acc ? " ± "+Math.round(state.acc)+" m" : ""}`;
}
marker.on("dragend", e => { const p = e.target.getLatLng(); setPos(p.lat,p.lng,{fromUser:true}); });
map.on("click", e => setPos(e.latlng.lat,e.latlng.lng,{fromUser:true}));

/* points déjà relevés ce soir, en repère visuel */
let pastLayer = L.layerGroup().addTo(map);
function drawPast(){
  pastLayer.clearLayers();
  if(!sess) return;
  sess.points.forEach((p,i) => {
    L.circleMarker([p.lat,p.lon],{radius:9,color:"#FFB020",weight:2,fillColor:"#FFB020",fillOpacity:.25,className:"past"})
      .bindTooltip(String(i+1),{permanent:true,direction:"center",className:"past"})
      .addTo(pastLayer);
  });
}
drawPast();

let watchId = null;
function locate(force){
  if(!navigator.geolocation){ paintGps(); return; }
  if(watchId !== null) navigator.geolocation.clearWatch(watchId);
  if(force){ state.moved = false; firstFix = true; }
  watchId = navigator.geolocation.watchPosition(
    p => {
      if(state.moved) return;              // ne pas écraser une correction manuelle
      setPos(p.coords.latitude, p.coords.longitude, {acc:p.coords.accuracy});
      if(firstFix){ map.setView([p.coords.latitude,p.coords.longitude], 17); firstFix = false; }
    },
    () => paintGps(),
    {enableHighAccuracy:true, maximumAge:10000, timeout:15000}
  );
}
locate(false);
$("#recenter").onclick = () => locate(true);
setTimeout(()=>map.invalidateSize(),300);

/* --- compteur + slider --- */
function setTotal(v){
  state.total = Math.max(0, Math.min(30, v));
  $("#total").textContent = state.total;
  $("#slider").value = state.total;
  clamp(); paintTags();
}
$("#slider").oninput = e => setTotal(+e.target.value);
$("#plus").onclick  = () => setTotal(state.total+1);
$("#minus").onclick = () => setTotal(state.total-1);

/* --- répartition --- */
function buildTags(host, keys, bag){
  host.innerHTML = "";
  keys.forEach(k=>{
    const el = document.createElement("div"); el.className="tag"; el.dataset.k=k;
    el.innerHTML = `<button type="button" data-d="-1" aria-label="Moins ${k}">−</button>
      <span class="name">${k}</span><span class="v">0</span>
      <button type="button" data-d="1" aria-label="Plus ${k}">+</button>`;
    el.querySelectorAll("button").forEach(b => b.onclick = () => {
      const d = +b.dataset.d;
      if(d > 0 && sum(bag) >= state.total) setTotal(state.total+1);  // dépasser = on monte le total
      bag[k] = Math.max(0, bag[k] + d);
      state.detailed = true; clamp(); paintTags();
    });
    host.appendChild(el);
  });
}
const sum = bag => Object.values(bag).reduce((a,b)=>a+b,0);
function clamp(){
  [state.modes,state.brands].forEach(bag=>{
    let over = sum(bag) - state.total;
    for(const k of Object.keys(bag)){ if(over<=0) break; const c=Math.min(bag[k],over); bag[k]-=c; over-=c; }
  });
}
function paintTags(){
  [[ "#modes",state.modes ],[ "#brands",state.brands ]].forEach(([sel,bag])=>{
    document.querySelectorAll(sel+" .tag").forEach(el=>{
      const v = bag[el.dataset.k]; el.querySelector(".v").textContent = v; el.classList.toggle("on", v>0);
    });
  });
  const rm = state.total - sum(state.modes), rb = state.total - sum(state.brands);
  $("#left").innerHTML = state.total === 0 ? "" :
    `Véhicule : <b>${rm}</b> non réparti${rm>1?"s":""} · Plateforme : <b>${rb}</b> non réparti${rb>1?"s":""}`;
}
buildTags($("#modes"), MODES, state.modes);
buildTags($("#brands"), BRANDS, state.brands);
$("#skip").onclick = () => {
  MODES.forEach(m=>state.modes[m]=0); BRANDS.forEach(b=>state.brands[b]=0);
  state.detailed = false; paintTags(); toast("Détail laissé vide, vous pouvez envoyer.");
};

/* --- envoi (avec file d'attente hors-ligne) --- */
function toast(msg, bad){
  const t=$("#toast"); t.textContent=msg; t.className="toast"+(bad?" bad":""); t.style.display="block";
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display="none",4000);
}
const QK = "maraude.queue";
const readQ  = () => { try{ return JSON.parse(localStorage.getItem(QK)||"[]"); }catch(e){ return []; } };
const writeQ = q => { try{ localStorage.setItem(QK, JSON.stringify(q)); }catch(e){} };

async function post(rec){
  if(!ENDPOINT) throw new Error("no endpoint");
  const r = await fetch(ENDPOINT,{ method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},   // évite le préflight CORS
    body: JSON.stringify(rec) });
  if(!r.ok) throw new Error("http "+r.status);
  let body = null;
  try{ body = await r.json(); }catch(e){ throw new Error("réponse illisible du serveur"); }
  if(!body || body.ok !== true) throw new Error(body && body.error ? body.error : "le serveur a refusé l'envoi");
  return true;
}
async function flush(){
  let q = readQ(); if(!q.length) return;
  const rest = [];
  for(const rec of q){ try{ await post(rec); }catch(e){ rest.push(rec); } }
  writeQ(rest);
  if(q.length && !rest.length) toast(`${q.length} relevé(s) en attente envoyé(s).`);
}
window.addEventListener("online", flush); flush();

$("#send").onclick = async () => {
  const prenom = $("#prenom").value.trim();
  if(!prenom){ $("#prenom").focus(); return toast("Indiquez votre prénom.", true); }
  if(state.lat === null) return toast("Placez la pastille sur la carte.", true);

  if(!sess) openSess();
  const rec = {
    id: uid(),
    maraude_id: sess.id,
    point_n: sess.points.length + 1,
    horodatage_envoi: new Date().toISOString(),
    prenom, date: $("#dateIn").value, heure: $("#timeIn").value,
    lat: +state.lat.toFixed(6), lon: +state.lon.toFixed(6),
    precision_m: state.moved ? "" : (state.acc ? Math.round(state.acc) : ""),
    position_corrigee: state.moved ? "oui" : "non",
    livreurs: state.total,
    velo: state.modes["Vélo"], scooter: state.modes["Scooter / moto"], vehicule_autre: state.modes["Autre"],
    deliveroo: state.brands["Deliveroo"], ubereats: state.brands["Uber Eats"], plateforme_autre: state.brands["Autre / inconnu"],
    detail_renseigne: state.detailed ? "oui" : "non"
  };

  $("#send").disabled = true; $("#send").textContent = "Envoi…";
  let differe = false, erreur = "";
  try{ await post(rec); }
  catch(e){ const q = readQ(); q.push(rec); writeQ(q); differe = true; erreur = e.message || String(e); }
  $("#send").disabled = false; $("#send").textContent = "Envoyer le relevé";

  sess.points.push({id:rec.id, lat:rec.lat, lon:rec.lon, total:rec.livreurs, envoye:!differe});
  sess.maj = Date.now(); saveSess(); paintSess(); drawPast();
  toast(differe
    ? `Point ${rec.point_n} gardé sur le téléphone (${erreur}). Nouvel essai automatique.`
    : `Point ${rec.point_n} enregistré. Prêt pour le suivant.`, differe);

  // point suivant : prénom et maraude conservés, tout le reste repart à zéro
  setTotal(0); state.detailed = true;
  const n = now(); $("#dateIn").value = n.date; $("#timeIn").value = n.time; paintStamp();
  state.moved = false; locate(false);           // on reprend le GPS pour le prochain point
  window.scrollTo({top:0, behavior:"smooth"});
};

/* --- annuler le dernier point --- */
$("#undo").onclick = async () => {
  const p = sess.points[sess.points.length-1];
  if(!confirm(`Annuler le point ${sess.points.length} (${p.total} livreurs) ?`)) return;
  const q = readQ(), i = q.findIndex(r => r.id === p.id);
  if(i > -1){ q.splice(i,1); writeQ(q); }                       // pas encore parti : on le retire
  else { try{ await post({annule_id:p.id, maraude_id:sess.id}); }   // déjà parti : on marque la ligne
         catch(e){ const qq=readQ(); qq.push({annule_id:p.id, maraude_id:sess.id}); writeQ(qq); } }
  sess.points.pop(); sess.maj = Date.now(); saveSess(); paintSess(); drawPast();
  toast("Point annulé.");
};

/* --- terminer la maraude --- */
$("#endSess").onclick = () => {
  const n = sess.points.length, l = sess.points.reduce((a,p)=>a+p.total,0);
  if(!confirm(`Terminer la maraude ? ${n} point${n>1?"s":""}, ${l} livreur${l>1?"s":""} comptés.`)) return;
  sess = null; saveSess(); paintSess(); drawPast();
  toast(`Maraude terminée : ${n} point${n>1?"s":""}, ${l} livreur${l>1?"s":""}. Merci !`);
};
</script>
</body>
